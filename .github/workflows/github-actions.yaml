name: georgia-hello-world-pipeline
on: [push]
jobs:
  validate-lint-test-and-build:
    runs-on: ubuntu-latest
    steps:
    # TODOthese can run concurrently
    - name: Checkout
      uses: actions/checkout@v2

    - name: lint
      run: |
        ./bin/lint.sh

    - name: test
      run: |
        ./bin/test.sh

  build-and-publish:
    needs: [validate-lint-test-and-build]
    # is there a nicer way to only do main? I don't like the publish step showing up on th branch build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: login-to-ghcr
      uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GHCR_GITHUB_TOKEN }}

    - name: build_and_publish
      run: |
        ./bin/build_and_publish.sh
